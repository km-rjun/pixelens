[package]
name = "pixelens-keyhook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pixelens global hotkey listener (pixelens-keyhook)"

[[bin]]
name = "pixelens-keyhook"
path = "src/main.rs"

[dependencies]
pixelens-capture = { workspace = true }
pixelens-ipc = { workspace = true }
pixelens-config = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }

# Wayland backend: read evdev key events directly (compositor-agnostic).
evdev = "0.12"

# X11 backend: pure-Rust X11 key listener.
x11rb = { version = "0.13", features = ["randr"] }
