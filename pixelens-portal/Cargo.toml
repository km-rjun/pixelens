[package]
name = "pixelens-portal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "xdg-desktop-portal native screen capture backend for Pixelens"

[dependencies]
pixelens-core = { workspace = true }
pixelens-capture = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Everything below is Unix-only and feature-gated so the default workspace
# build (and the Windows check) stays clean.
[target.'cfg(not(windows))'.dependencies]
tokio = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
ashpd = { version = "0.10", default-features = false, features = ["tokio"], optional = true }

[features]
default = []
portal = ["dep:tokio", "dep:image", "dep:ashpd"]
