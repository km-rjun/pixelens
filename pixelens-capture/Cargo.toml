[package]
name = "pixelens-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Display server detection and screen capture backends (Wayland, X11)"

[dependencies]
pixelens-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = "1.0"

[features]
# Gate for the `Portal` capture variant. No deps here — the portal
# backend is constructed by the daemon (which depends on `pixelens-portal`
# directly). Kept so dependents can enable it without pulling a cycle
# (capture must not depend on portal; portal depends on capture).
portal = []

# Windows backend: WinRT GraphicsCapturePicker + WIC PNG encoder.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
] }
