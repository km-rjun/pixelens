name: CI

on:
  push:
    branches: [main, features/**]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config \
            slurp grim tesseract-ocr \
            xdg-utils libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Fmt
        run: cargo fmt --all --check

      - name: Build release .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh ${{ github.ref_name == 'main' && github.ref_name || 'dev' }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelens-deb
          path: target/debian/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --workspace --locked --target x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Build release
        run: cargo build --workspace --locked --release --target x86_64-pc-windows-msvc

      - name: Create Windows zip
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/pixelens*.exe -DestinationPath pixelens-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelens-windows
          path: pixelens-windows-x64.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pixelens-deb
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pixelens-windows
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux/*.deb
            artifacts/windows/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}