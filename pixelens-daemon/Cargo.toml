[package]
name = "pixelens-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pixelens background daemon (pixelensd)"

[[bin]]
name = "pixelensd"
path = "src/main.rs"

[dependencies]
pixelens-core = { workspace = true }
pixelens-capture = { workspace = true }
pixelens-config = { workspace = true }
pixelens-ipc = { workspace = true }
pixelens-ai = { workspace = true }
pixelens-notify = { workspace = true }
pixelens-ocr = { workspace = true }
pixelens-overlay = { workspace = true }
pixelens-search = { workspace = true }

anyhow = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pixelens-ipc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[features]
# UM5: enable the xdg-desktop-portal capture backend as the preferred
# fast-path (transparent slurp/grim fallback inside the backend). Off by
# default — v1 ships the pure slurp/grim path.
portal = ["pixelens-capture/portal", "pixelens-portal?/portal", "dep:pixelens-portal"]

[dependencies.pixelens-portal]
workspace = true
optional = true
